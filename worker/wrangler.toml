name = "cybershield-ai"
main = "worker.js"
compatibility_date = "2026-10-01"

[vars]
# Сайты, которым разрешено спрашивать нейросеть (через запятую, без / в конце)
ALLOWED_ORIGINS = "https://insomn1adevelopment.github.io,http://localhost:8000"
# OpenAI-совместимый API. Ключ задаётся отдельно: npx wrangler secret put AI_API_KEY
AI_BASE_URL = "https://api.groq.com/openai/v1"
AI_MODEL = "llama-3.3-70b-versatile"

# Не больше 10 вопросов в минуту с одного IP
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 10
  period = 60
